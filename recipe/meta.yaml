{% set name = "svglib" %}
{% set version = "2.3.1" %}
{% set hash = "c0a57bacb5f53b1a0db2321fe37d350c45195cbee16d84741fb97ae8dcd0a702" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ hash }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vvv
  noarch: python

requirements:
  host:
    - hatchling
    - pip
    - python {{ python_min }}

  run:
    - python >={{ python_min }}
    - cssselect2 >=0.2.0
    - lxml >=6.0.0
    - reportlab >=4.4.3
    - rlpycairo >=0.4.0
    - tinycss2 >=0.6.0

test:
  requires:
    - pytest-runner
    - python {{ python_min }}
  imports:
    - svglib
  source_files:
    - tests

about:
  home: https://github.com/deeplook/svglib
  license: LGPL-3.0-only
  license_file: LICENSE.txt
  summary: A pure-Python library for reading and converting SVG
  license_family: LGPL

extra:
  recipe-maintainers:
    - nicoddemus
